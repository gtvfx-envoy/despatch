name: Envoy Release Impact

on:
  repository_dispatch:
    types: [envoy-released]
  workflow_dispatch:
    inputs:
      envoy_version:
        description: Unprefixed Envoy semantic version to replay
        required: true
        type: string

permissions:
  contents: read
  issues: write
  # Needed only for the notify job's opt-in auto-cascade dispatch below
  # (RELEASE_AUTOMATION_AUTO_PREPARE); dispatching this repository's own
  # prepare-release.yml via `workflow_dispatch` is exempt from the usual
  # GITHUB_TOKEN recursive-trigger restriction, so no cross-repo App token
  # is needed for this same-repo dispatch.
  actions: write

env:
  ENVOY_TAG: ${{ github.event.client_payload.envoy_tag || format('v{0}', inputs.envoy_version) }}

jobs:
  classify:
    name: Classify Envoy changes
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.impact.outputs.relevant }}
      pinned_tag: ${{ steps.current.outputs.envoy_tag }}

    steps:
      - name: Checkout Despatch
        uses: actions/checkout@v7

      - name: Checkout candidate Envoy release
        uses: actions/checkout@v7
        with:
          repository: gtvfx-envoy/envoy
          ref: ${{ env.ENVOY_TAG }}
          fetch-depth: 0
          path: downstream/envoy

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate release and current pin
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_COMMIT: ${{ github.event.client_payload.envoy_commit }}
          SCHEMA_VERSION: ${{ github.event.client_payload.schema_version }}
        run: |
          gh api "repos/gtvfx-envoy/envoy/releases/tags/$ENVOY_TAG" --jq .tag_name
          if [[ "${{ github.event_name }}" == repository_dispatch ]]; then
            test "$SCHEMA_VERSION" = 1
            test "$(git -C downstream/envoy rev-parse HEAD)" = "$PAYLOAD_COMMIT"
          fi
          python scripts/release_automation.py check --github-output "$GITHUB_OUTPUT"

      - name: Classify changed Envoy files
        id: impact
        run: >-
          python scripts/release_automation.py impact
          --envoy-root downstream/envoy
          --base-tag "${{ steps.current.outputs.envoy_tag }}"
          --head-tag "$ENVOY_TAG"
          --output impact.json
          --github-output "$GITHUB_OUTPUT"

      - name: Upload impact evidence
        uses: actions/upload-artifact@v4
        with:
          name: envoy-impact
          path: impact.json

  validate:
    name: Validate source and frozen executable
    needs: classify
    if: needs.classify.outputs.relevant == 'true'
    runs-on: [self-hosted, X64, Windows]
    env:
      ENVOY_BUILD_STACK: ${{ github.workspace }}/tests/fixtures/stacks/build/build.estack
      ENVOY_STACK: ${{ github.workspace }}/tests/fixtures/stacks/build/build.estack
      # The build Stack pins its bundles as ${ENVOY_STUDIO_BNDLS}/..., so the
      # variable must be set or the Stack fails to load outright. Prefer a
      # repository/organization variable so a differently-provisioned runner
      # can point at its own share without editing this workflow; the literal
      # is only a fallback for the current self-hosted runner.
      ENVOY_STUDIO_BNDLS: ${{ vars.ENVOY_STUDIO_BNDLS || '//THO_CLOUD/gavyn/studio/envoy/bndl' }}

    steps:
      - name: Checkout Despatch
        uses: actions/checkout@v7

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"

      - name: Bootstrap candidate Envoy release
        id: bootstrap
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          .\scripts\install-envoy-release.ps1
          -ReleaseTag "$env:ENVOY_TAG"

      - name: Validate repository build Stack
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:ENVOY_BUILD_STACK -PathType Leaf)) {
            throw "Repository build Stack is unavailable: '$env:ENVOY_BUILD_STACK'."
          }

      - name: Install development dependencies
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sitePackages = Join-Path $env:ENVOY_SITE_PACKAGES 'Python311\site-packages'
          python -m pip install `
            --disable-pip-version-check --upgrade --target $sitePackages `
            '.[dev,docs]' 'PyInstaller==6.21.0'

      - name: Run source tests and lint
        id: source
        continue-on-error: true
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          envoy --stack="$env:ENVOY_BUILD_STACK" python -m pytest
          envoy --stack="$env:ENVOY_BUILD_STACK" python -m ruff check .
          envoy --stack="$env:ENVOY_BUILD_STACK" python -m ruff format --check .

      - name: Build final windowed executable
        id: build
        continue-on-error: true
        shell: pwsh
        run: .\scripts\build-executable.ps1 -SkipToolInstall

      - name: Validate final executable
        id: executable
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = (Resolve-Path -LiteralPath '.\dist\despatch.exe').Path
          if ((Get-Item -LiteralPath $executable).Length -le 0) {
              throw 'The executable is empty.'
          }
          $versionProcess = Start-Process $executable -ArgumentList '--version' -Wait -PassThru
          if ($versionProcess.ExitCode -ne 0) { throw 'despatch.exe --version failed.' }

          $requestPath = Join-Path $env:RUNNER_TEMP 'invalid-launch-request.json'
          $resultPath = Join-Path $env:RUNNER_TEMP 'invalid-launch-result.json'
          '{}' | Set-Content -LiteralPath $requestPath -Encoding utf8
          $worker = Start-Process $executable `
              -ArgumentList '--launch-worker', $requestPath, $resultPath -Wait -PassThru
          if ($worker.ExitCode -ne 2) { throw "Invalid worker exited $($worker.ExitCode)." }
          $workerResult = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($workerResult.error -notmatch 'Invalid launch request') {
              throw 'The frozen worker did not return the expected structured error.'
          }

          $readyPath = Join-Path $env:RUNNER_TEMP 'despatch-docs-ready.json'
          $docs = Start-Process $executable -ArgumentList '--docs-server', $readyPath -PassThru
          try {
              $deadline = [DateTime]::UtcNow.AddSeconds(30)
              while (-not (Test-Path -LiteralPath $readyPath)) {
                  if ($docs.HasExited) { throw "Documentation helper exited early." }
                  if ([DateTime]::UtcNow -ge $deadline) { throw 'Documentation helper timed out.' }
                  Start-Sleep -Milliseconds 100
              }
              $ready = Get-Content -LiteralPath $readyPath -Raw | ConvertFrom-Json
              $response = Invoke-WebRequest -Uri $ready.url -UseBasicParsing
              if ($response.StatusCode -ne 200 -or $response.Content -notmatch '<title>Despatch') {
                  throw 'Bundled documentation is invalid.'
              }
          } finally {
              taskkill /PID $docs.Id /T /F 2>$null | Out-Null
          }
          Write-Output "Executable SHA-256: $((Get-FileHash $executable -Algorithm SHA256).Hash)"

      - name: Record validation result
        if: always()
        shell: pwsh
        run: |
          $checks = [ordered]@{
              bootstrap = '${{ steps.bootstrap.outcome }}'
              install = '${{ steps.install.outcome }}'
              source = '${{ steps.source.outcome }}'
              build = '${{ steps.build.outcome }}'
              executable = '${{ steps.executable.outcome }}'
          }
          $classification = if ($checks.Values -contains 'failure') { 'required' } else { 'review' }
          @{
              classification = $classification
              checks = $checks
          } | ConvertTo-Json -Depth 4 | Set-Content compatibility-result.json -Encoding utf8

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: despatch-compatibility
          path: compatibility-result.json
          if-no-files-found: error

  notify:
    name: Create or update release-impact issue
    needs: [classify, validate]
    if: always() && needs.classify.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Despatch
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download impact evidence
        uses: actions/download-artifact@v4
        with:
          name: envoy-impact
          path: evidence

      - name: Download validation evidence
        if: needs.classify.outputs.relevant == 'true'
        uses: actions/download-artifact@v4
        with:
          name: despatch-compatibility
          path: evidence

      - name: Report no release impact
        if: needs.classify.outputs.relevant != 'true'
        run: |
          echo "### Despatch: no release impact" >> "$GITHUB_STEP_SUMMARY"
          echo "Envoy $ENVOY_TAG has no relevant Core or Python changes." >> "$GITHUB_STEP_SUMMARY"

      - name: Build issue report
        if: needs.classify.outputs.relevant == 'true'
        id: report
        run: >-
          python scripts/release_automation.py report
          --impact evidence/impact.json
          --result evidence/compatibility-result.json
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --output issue.md
          --github-output "$GITHUB_OUTPUT"

      - name: Create or update issue
        if: needs.classify.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFICATION: ${{ steps.report.outputs.classification }}
          MARKER: ${{ steps.report.outputs.marker }}
        run: |
          gh label create dependency:envoy --color 1D76DB --force \
            --description "Tracks the Envoy runtime embedded by Despatch"
          gh label create "release-impact:$CLASSIFICATION" --color D93F0B --force \
            --description "Automated downstream release assessment"
          issue_number="$(
            gh issue list --state all --limit 100 --json number,body \
              --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" | head -n 1
          )"
          title="Review Envoy $ENVOY_TAG compatibility and release impact"
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --title "$title" --body-file issue.md \
              --add-label dependency:envoy --add-label "release-impact:$CLASSIFICATION"
            if [[ "$CLASSIFICATION" == required ]]; then
              gh issue edit "$issue_number" --remove-label release-impact:review || true
            else
              gh issue edit "$issue_number" --remove-label release-impact:required || true
            fi
            gh issue reopen "$issue_number" || true
          else
            gh issue create --title "$title" --body-file issue.md \
              --label dependency:envoy --label "release-impact:$CLASSIFICATION"
          fi

      # Despatch has no Rust toolchain in CI, so download the latest
      # released engit (built and published by Envoy Utils) rather than
      # building it from source. Verified the same way bundle-publish.yml
      # verifies engit downloads: SHA256SUMS from the same release.
      - name: Download Engit
        if: >-
          needs.classify.outputs.relevant == 'true' &&
          steps.report.outputs.classification == 'review' &&
          vars.RELEASE_AUTOMATION_AUTO_PREPARE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          engit_tag="$(gh release view --repo gtvfx-envoy/envoy_utils --json tagName --jq .tagName)"
          asset="envoy_utils-$engit_tag-linux-x86_64-musl.tar.gz"
          release_directory="$RUNNER_TEMP/engit-$engit_tag"
          mkdir -p "$release_directory"
          gh release download "$engit_tag" \
            --repo gtvfx-envoy/envoy_utils \
            --pattern "$asset" --pattern SHA256SUMS \
            --dir "$release_directory" --clobber
          expected="$(awk -v asset="$asset" '$2 == asset {print $1}' "$release_directory/SHA256SUMS")"
          [[ -n "$expected" ]] || { echo "No checksum found for $asset" >&2; exit 1; }
          actual="$(sha256sum "$release_directory/$asset" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "Checksum mismatch for $asset" >&2; exit 1; }
          mkdir -p "$release_directory/bundle"
          tar -xzf "$release_directory/$asset" -C "$release_directory/bundle"
          engit="$(find "$release_directory/bundle" -type f -name engit -print -quit)"
          [[ -n "$engit" ]] || { echo "engit was not found in the release archive" >&2; exit 1; }
          echo "$(dirname "$engit")" >> "$GITHUB_PATH"

      # A `review` classification means Despatch's source, lint, and frozen
      # executable already validated cleanly against this Envoy candidate --
      # the mechanical case automation can safely act on. `required`
      # (validation failure) always still needs a human fix first and is
      # deliberately excluded here. This only ever dispatches the existing,
      # unmodified prepare-release.yml, which still runs its own full
      # validation and opens a draft pull request; nothing is auto-merged.
      - name: Dispatch downstream Prepare Release
        if: >-
          needs.classify.outputs.relevant == 'true' &&
          steps.report.outputs.classification == 'review' &&
          vars.RELEASE_AUTOMATION_AUTO_PREPARE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.report.outputs.marker }}
        run: |
          envoy_version="${ENVOY_TAG#v}"
          engit release-train prepare-downstream \
            --owner "${{ github.repository_owner }}" \
            --repo despatch \
            --envoy-version "$envoy_version"
          issue_number="$(
            gh issue list --state all --limit 100 --json number,body \
              --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" | head -n 1
          )"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body \
              "🤖 Automatically dispatched **Prepare Release** for Despatch with Envoy \`v$envoy_version\`. See the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/workflows/prepare-release.yml) for progress."
          fi
