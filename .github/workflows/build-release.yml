name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      envoy_release:
        description: Envoy release to embed in the executable
        required: true
        default: v0.5.0
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: [self-hosted, X64, Windows, synology]
    env:
      ENVOY_RELEASE: ${{ inputs.envoy_release || 'v0.5.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Download Envoy Python wheel
        shell: pwsh
        run: |
          $headers = @{
              Accept = 'application/vnd.github+json'
              'User-Agent' = 'gt-despatch-release'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseTag = [Uri]::EscapeDataString($env:ENVOY_RELEASE)
          $releaseUri = "https://api.github.com/repos/gtvfx-contrib/gt-envoy/releases/tags/$releaseTag"
          $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers
          $assets = @($release.assets | Where-Object {
              $_.name -match '^envoy-.+-cp310-abi3-win_amd64\.whl$'
          })
          if ($assets.Count -ne 1) {
              throw "Expected one Windows Envoy wheel in release '$env:ENVOY_RELEASE'; found $($assets.Count)."
          }

          $dependencyDirectory = Join-Path $env:RUNNER_TEMP 'despatch-dependencies'
          New-Item -ItemType Directory -Path $dependencyDirectory -Force | Out-Null
          $wheelPath = Join-Path $dependencyDirectory $assets[0].name
          Invoke-WebRequest -Uri $assets[0].browser_download_url -OutFile $wheelPath
          "ENVOY_WHEEL=$wheelPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install $env:ENVOY_WHEEL '.[executable]'

      - name: Build executable
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          .\scripts\build-executable.ps1 -PythonExecutable $python -SkipToolInstall

      - name: Verify executable starts
        shell: pwsh
        run: |
          $process = Start-Process `
              -FilePath .\dist\despatch.exe `
              -ArgumentList '--version' `
              -Wait `
              -PassThru
          if ($process.ExitCode -ne 0) {
              throw "despatch.exe --version failed with exit code $($process.ExitCode)."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: despatch-${{ github.ref_name }}-windows-x64
          path: dist/despatch.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/despatch.exe
          fail_on_unmatched_files: true
