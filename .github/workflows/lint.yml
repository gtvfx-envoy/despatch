name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and Ruff
    runs-on: [self-hosted, X64, Windows, synology]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'

      - name: Read pinned Envoy release
        id: release-state
        shell: pwsh
        run: python scripts/release_automation.py check --github-output $env:GITHUB_OUTPUT

      - name: Bootstrap pinned Envoy
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          .\scripts\install-envoy-release.ps1
          -ReleaseTag "${{ steps.release-state.outputs.envoy_tag }}"

      - name: Install development dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev,executable]'

      - name: Verify Envoy development runtime
        run: |
          envoy --version
          envoy --info python

      - name: Run tests
        run: envoy python -m pytest

      - name: Run Ruff check
        run: envoy python -m ruff check .

      - name: Run Ruff format check
        run: envoy python -m ruff format --check .
