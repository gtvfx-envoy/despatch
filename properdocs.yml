site_name: Despatch
site_url: https://gtvfx-envoy.github.io/despatch/
site_description: Application launcher for Envoy-managed runtime Stacks.
repo_name: gtvfx-envoy/despatch
repo_url: https://github.com/gtvfx-envoy/despatch
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/despatch_icon_charcoal_1024.png
  favicon: assets/despatch.ico
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: user/getting-started.md
    - Launcher and Tray: user/launcher.md
    - Choosing a Stack: user/stacks.md
    - Settings: user/settings.md
  - Technical Guide:
    - Architecture: technical/architecture.md
    - Stack Files: technical/stack-files.md
    - Configuration: technical/configuration.md
    - Bundle Manifests: technical/manifests.md
    - CLI Reference: technical/cli.md
  - Examples: examples.md
  - Troubleshooting: troubleshooting.md
  - Maintainer Release Guide: https://gtvfx-envoy.github.io/envoy/maintainers/releasing/
